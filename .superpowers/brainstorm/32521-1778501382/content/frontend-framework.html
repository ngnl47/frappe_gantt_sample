<h2>前端框架选择</h2>
<p class="subtitle">你提到了 React/Vue 作为前端框架选项，请问你倾向于使用哪一个？</p>

<div class="options">
  <div class="option" data-choice="react" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>React</h3>
      <p>更成熟的生态系统，Frappe Gantt 有官方 React 支持</p>
    </div>
  </div>
  <div class="option" data-choice="vue" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Vue 3</h3>
      <p>更轻量，模板语法更直观</p>
    </div>
  </div>
  <div class="option" data-choice="other" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>其他偏好</h3>
      <p>请在终端说明你的选择</p>
    </div>
  </div>
</div>
