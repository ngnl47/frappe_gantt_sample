<h2>预设数据场景设计</h2>
<p class="subtitle">预设数据需要展示什么场景？请选择：</p>

<div class="options">
  <div class="option" data-choice="simple" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>简单场景</h3>
      <p>3-5 个服务器，2-3 个时间段，展示基本的指向关系和暂停期</p>
    </div>
  </div>
  <div class="option" data-choice="complex" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>复杂场景</h3>
      <p>10+ 个服务器，多个交叉时间段，展示复杂的指向链和依赖关系</p>
    </div>
  </div>
  <div class="option" data-choice="specific" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>特定业务场景</h3>
      <p>请描述你希望展示的具体业务场景（如某次合服战的实际配置）</p>
    </div>
  </div>
  <div class="option" data-choice="design" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>让我设计</h3>
      <p>请你根据业务特点设计一个合理的示例场景</p>
    </div>
  </div>
</div>
