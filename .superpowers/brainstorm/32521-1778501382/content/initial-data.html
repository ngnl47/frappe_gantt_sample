<h2>初始数据生成</h2>
<p class="subtitle">你提到需要生成一份初始数据用于展示，请问你倾向于哪种方式？</p>

<div class="options">
  <div class="option" data-choice="fixed" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>固定预设数据</h3>
      <p>硬编码一组示例数据（如 5-10 个服务器，若干时间段），每次刷新数据不变</p>
    </div>
  </div>
  <div class="option" data-choice="random" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>随机生成数据</h3>
      <p>启动时随机生成一组数据，每次刷新重新生成</p>
    </div>
  </div>
  <div class="option" data-choice="empty" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>用户手动创建</h3>
      <p>启动时为空，用户手动添加服务器和数据</p>
    </div>
  </div>
  <div class="option" data-choice="fixed-editable" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>固定数据 + 可编辑（推荐）</h3>
      <p>预设一组数据，但用户可以在此基础上增删改</p>
    </div>
  </div>
</div>
