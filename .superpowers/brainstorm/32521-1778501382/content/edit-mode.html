<h2>数据编辑方式</h2>
<p class="subtitle">你提到用"编辑功能替代拖拽"，具体指哪种方式？</p>

<div class="options">
  <div class="option" data-choice="modal" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>弹窗编辑</h3>
      <p>点击任务块弹出模态框，在表单中编辑所有字段</p>
    </div>
  </div>
  <div class="option" data-choice="sidebar" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>侧边栏编辑</h3>
      <p>点击任务块在右侧/左侧面板显示编辑表单</p>
    </div>
  </div>
  <div class="option" data-choice="inline" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>内联编辑</h3>
      <p>直接在甘特图行内显示编辑表单（类似表格编辑）</p>
    </div>
  </div>
  <div class="option" data-choice="separate" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>独立编辑页面</h3>
      <p>编辑操作跳转到单独的页面/路由</p>
    </div>
  </div>
</div>
