<h2>构建工具选择</h2>
<p class="subtitle">Vue 3 项目通常使用什么构建工具？</p>

<div class="options">
  <div class="option" data-choice="vite" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Vite（推荐）</h3>
      <p>Vue 官方推荐，开发体验极佳，启动快，HMR 快</p>
    </div>
  </div>
  <div class="option" data-choice="vue-cli" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Vue CLI</h3>
      <p>传统方案，功能全面但较重，已不再官方首选</p>
    </div>
  </div>
  <div class="option" data-choice="cdn" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>不需要构建工具</h3>
      <p>直接用 CDN 引入 Vue，最简单但功能有限</p>
    </div>
  </div>
</div>
