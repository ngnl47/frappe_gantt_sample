<h2>UI 组件库</h2>
<p class="subtitle">是否需要使用 UI 组件库来简化开发？</p>

<div class="options">
  <div class="option" data-choice="full" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>使用组件库（推荐）</h3>
      <p>如 Element Plus / Ant Design Vue，提供现成的表单、弹窗、按钮等组件</p>
    </div>
  </div>
  <div class="option" data-choice="none" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>不使用组件库</h3>
      <p>手写样式和组件，更轻量但工作量更大</p>
    </div>
  </div>
  <div class="option" data-choice="lightweight" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>使用轻量组件库</h3>
      <p>如 Headless UI / Naive UI，只提供基础交互，样式自定义</p>
    </div>
  </div>
</div>
